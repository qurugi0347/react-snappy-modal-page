version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.12.2 && nvm use 20.12.2
        - npm install -g corepack@latest
        - corepack enable
        - corepack prepare yarn@3.8.7 --activate
        - yarn install --immutable
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .yarn/cache/**/*
      - node_modules/**/*
      - $HOME/.cache/puppeteer/**/*
